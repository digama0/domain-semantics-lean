name = "domain-semantics-lean"
defaultTargets = ["DomainSemantics"]

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.29.0"

[[lean_lib]]
name = "DomainSemantics"
globs = ["DomainSemantics", "DomainSemantics.Status", "DomainSemantics.Annot", "DomainSemantics.HasType", "DomainSemantics.Canon", "DomainSemantics.Interp", "DomainSemantics.Presheaf", "DomainSemantics.Strong", "DomainSemantics.Regular", "DomainSemantics.Inversion", "DomainSemantics.Counterexample"]
