name = "domain-semantics-lean"
defaultTargets = ["DomainSemantics"]

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.29.0"

[[lean_lib]]
name = "DomainSemantics"
globs = ["DomainSemantics", "DomainSemantics.Annot", "DomainSemantics.HasType", "DomainSemantics.Interp", "DomainSemantics.Directed", "DomainSemantics.Sound", "DomainSemantics.Regular", "DomainSemantics.Inversion"]
